# Stage the npm package from this repository, with provenance, for a human to
# approve. CV22.DS10.US3's release gate (2026-10-10).
#
# This workflow is the trusted publisher npm knows for `mirror-mind`:
# `mirror-mind-ai/mirror`, this file, environment `release`. It holds no
# token. GitHub gives the job a short-lived OIDC identity (`id-token: write`),
# npm checks that identity against the three facts above, and the tarball
# carries a provenance attestation naming this repository and commit.
#
# It publishes what is COMMITTED. The version is the one in package.json at
# the dispatched ref; nothing here edits it, so the attestation and the
# tarball agree about what was built.
#
# It STAGES, it does not publish. The trusted publisher is allowed `npm stage
# publish` only: the version lands on the registry in a staged state that no
# install can see, and a maintainer with 2FA finishes it --
#
#   npm stage list mirror-mind
#   npm stage download <stage-id>     # inspect the tarball first, if you like
#   npm stage approve  <stage-id>     # public
#   npm stage reject   <stage-id>     # gone
#
# -- which is the project's rule (publication is a Navigator-authorized hard
# gate) in npm's own vocabulary. Two human steps stand before the registry:
# the `release` environment's required reviewer before the job runs, and the
# approve with a one-time code after it.
#
# A release under `stable` has one more step, also a maintainer's with 2FA
# (CR125). `npm install -g mirror-mind` installs the `latest` dist-tag, a
# stage carries one tag, and the trusted publisher can run nothing but the
# stage, so `latest` is moved by hand once the version is public --
#
#   npm dist-tag add mirror-mind@<version> latest
#   npm view mirror-mind dist-tags    # latest and stable at <version>
#
# -- and a rehearsal under `next` leaves it alone. The last step prints this
# route with the version filled in.
#
# Dispatch it only on a commit whose Tests workflow is green.

name: Publish

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "dist-tag for the staged version: `stable` for a release (the updater reads it; a maintainer then moves `latest`), `next` for a rehearsal"
        required: true
        default: next
        type: string

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    name: stage ${{ github.ref_name }} as ${{ inputs.dist_tag }}
    runs-on: ubuntu-latest
    environment: release
    # The input reaches every script through the environment, never pasted
    # into one (CR125).
    env:
      DIST_TAG: ${{ inputs.dist_tag }}
    steps:
      # Two tags, two meanings (CR125): `stable` is a release, the tag the
      # updater reads, and `next` is a rehearsal. A staged tag cannot be
      # changed afterwards, so anything else -- `latest`, a typo -- is refused
      # here, before a version is staged where the updater would never see it.
      - name: Known dist-tag
        run: |
          case "$DIST_TAG" in
            stable | next) echo "dist-tag: $DIST_TAG" ;;
            *)
              echo "dist_tag must be stable (a release) or next (a rehearsal), not '$DIST_TAG'" >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing and `npm stage` need a recent npm; the one bundled
      # with the runner's Node may be older than the registry's features. Pinned
      # to the major the rehearsal validated (12, 2026-10-10): `latest` moved the
      # `pack --json` shape under the pack guard once, and a release pipeline
      # should not meet a new npm by accident.
      - name: npm 12
        run: npm install -g npm@12 && npm --version

      - run: npm ci

      - name: What this commit would ship
        run: |
          echo "version: $(node -p 'require("./package.json").version')"
          echo "dist-tag: $DIST_TAG"
          npm pack --dry-run 2>&1 | tail -8

      # The two guards that make the Zero Python claim for the artifact: the
      # tree holds no retired surface, and the tarball holds the runtime
      # subset and nothing else, with no forbidden content.
      - name: Retired-surface tripwire
        run: node ts/scripts/checkRetiredSurfaces.ts
      - name: Pack contents
        run: node ts/scripts/checkPackContents.ts

      - name: Stage with provenance
        run: npm stage publish . --provenance --tag "$DIST_TAG"

      # What is left is a maintainer's, with 2FA (CR125), and this prints it
      # where the run ends: the approve, then for `stable` the `latest` move,
      # then the view that shows both tags. The name and version come from the
      # package.json the stage packed. Nothing parses npm's output, which npm
      # documents no format for. `release:promote` prints the same rule
      # (ts/scripts/releasePromote.ts): only `stable`, the updater's default
      # channel, moves `latest`. Change one, change both.
      - name: What a maintainer does next
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          {
            echo "## ${name}@${version} staged as \`${DIST_TAG}\`"
            echo
            echo "Nothing is public yet. A maintainer finishes it with 2FA, or drops it with \`npm stage reject <stage-id>\`:"
            echo
            echo "\`\`\`"
            echo "npm stage list ${name}  # the stage id"
            echo "npm stage download <stage-id>  # inspect the tarball first, if you like"
            echo "npm stage approve <stage-id>  # public, under ${DIST_TAG}"
            if [ "$DIST_TAG" = stable ]; then
              echo "npm dist-tag add ${name}@${version} latest"
            fi
            echo "npm view ${name} dist-tags"
            echo "\`\`\`"
            echo
            if [ "$DIST_TAG" = stable ]; then
              echo "\`npm install -g ${name}\` installs \`latest\` and the updater reads \`stable\`, so the view must show both at ${version}."
            else
              echo "\`latest\` stays where it is: only a release under \`stable\` moves it."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
