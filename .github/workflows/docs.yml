name: Docs

on:
  push:
    branches: [main, "claude/**", mirror-ts-core]
    paths:
      - "docs/**"
      - "**.md"
      - "scripts/check_doc_links.py"
      - "ts/scripts/checkSkillCommandParity.ts"
      - "src/memory/docs_lint.py"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "**.md"
      - "scripts/check_doc_links.py"
      - "ts/scripts/checkSkillCommandParity.ts"
      - "src/memory/docs_lint.py"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: uv sync --frozen

      # CV22.DS10.TS5 slice B: the Node port runs BESIDE the Python original
      # for exactly one commit, and both must agree -- same exit code, same
      # first problem line -- on a clean tree and on a seeded regression,
      # before the original is deleted. This is the discipline US2 used to
      # retire `check_skill_command_parity.py`, and the reason the guard that
      # proves the repository holds no Python cannot itself be Python.
      #
      # The port carries the 26-case self-test of
      # `tests/unit/memory/test_docs_lint.py` into
      # `ts/test/scripts/docsLint.test.ts`. That test IS this checker's
      # specification: `scripts/check_doc_links.py` is a 57-line wrapper with
      # no test of its own, so porting it without the cases would have shipped
      # the docs gate untested -- in the story that rewrites ten docs.
      - name: Check documentation links and anchors (Python original)
        run: uv run python scripts/check_doc_links.py

      - name: Check documentation links and anchors (Node port, must agree)
        run: node ts/scripts/checkDocLinks.ts

      # Fails when a strangler flip updates the invocation in one runtime's
      # skill copy and not the others (CR071). By 2026-09-09 eleven skills had
      # drifted this way -- reaching the front door on Pi while still calling
      # `uv run python -m memory` on Claude Code and the published plugin, for
      # commands flipped as far back as DS3. Nothing failed, because Python
      # answered correctly; the claim "answers from TS" was simply untrue for
      # two of three runtimes.
      #
      # Ported to Node by CV22.DS10.US2 (D6): a check whose job is to assert
      # that nothing invokes the interpreter cannot itself need that
      # interpreter to run, and after TS5 there would be nothing left to
      # execute the Python version. Both guards ran side by side in the
      # previous commit and agreed, on a clean tree and on a seeded
      # regression, before the Python one was deleted.
      #
      # It asserts what the original could not: ABSENCE. The allowlist
      # mechanism is deleted rather than emptied -- an empty dictionary invites
      # the next story to add a row, which is the escape hatch DS10's Skill
      # Invocation Gate exists to close -- and the scan covers the whole
      # packaged plugin, manifest and commands and hooks included, because an
      # installed user resolves that directory and not this repository's .pi/.
      - name: Check skill command parity across runtime copies
        run: node ts/scripts/checkSkillCommandParity.ts
