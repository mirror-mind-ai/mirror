name: Docs

on:
  push:
    branches: [main, "claude/**", mirror-ts-core]
    paths:
      - "docs/**"
      - "**.md"
      - "scripts/check_doc_links.py"
      - "scripts/check_skill_command_parity.py"
      - "ts/scripts/checkSkillCommandParity.ts"
      - "src/memory/docs_lint.py"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "**.md"
      - "scripts/check_doc_links.py"
      - "scripts/check_skill_command_parity.py"
      - "ts/scripts/checkSkillCommandParity.ts"
      - "src/memory/docs_lint.py"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check documentation links and anchors
        run: uv run python scripts/check_doc_links.py

      # Fails when a strangler flip updates the invocation in one runtime's
      # skill copy and not the others (CR071). By 2026-09-09 eleven skills had
      # drifted this way -- reaching the front door on Pi while still calling
      # `uv run python -m memory` on Claude Code and the published plugin, for
      # commands flipped as far back as DS3. Nothing failed, because Python
      # answered correctly; the claim "answers from TS" was simply untrue for
      # two of three runtimes, and DS10 deletes the module those copies invoke.
      - name: Check skill command parity across runtime copies
        run: uv run python scripts/check_skill_command_parity.py

      # CV22.DS10.US2 (D6): the Node successor, running BESIDE the Python one
      # for exactly one commit so that "the two agree" is evidence rather than
      # a claim. The next commit deletes the Python guard -- a check whose job
      # is to assert that nothing invokes the interpreter cannot itself need
      # that interpreter to run, and after TS5 there would be nothing left to
      # execute it.
      #
      # It also asserts what the Python one never could: ABSENCE. The allowlist
      # mechanism is deleted rather than emptied, and the scan covers the whole
      # packaged plugin -- manifest, commands, hooks -- because an installed
      # user resolves that directory, not this repository's `.pi/`.
      - name: Check skill command parity (Node successor)
        run: node ts/scripts/checkSkillCommandParity.ts
