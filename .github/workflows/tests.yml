name: Tests

on:
  push:
    branches: [main, "claude/**", mirror-ts-core]
    paths-ignore: ["docs/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Format check (ruff)
        run: uv run ruff format --check src/ tests/

      - name: Run tests
        run: uv run pytest tests/unit/ tests/integration/ -m "not live" --cov=src --cov-report=term-missing
        env:
          MEMORY_ENV: test
          ECONOMY_ENV: test
          # API keys intentionally absent — all live tests are excluded via -m "not live"

      - name: Golden parity determinism (regenerate must be a no-op)
        run: |
          uv run python ts/parity/generate_golden.py
          uv run python ts/parity/generate_persona_golden.py
          uv run python ts/parity/generate_journeys_golden.py
          uv run python ts/parity/generate_validate_parent_journey_golden.py
          uv run python ts/parity/generate_journey_removal_golden.py
          uv run python ts/parity/generate_mirror_mode_golden.py
          uv run python ts/parity/generate_mirror_state_golden.py
          uv run python ts/parity/generate_extension_context_golden.py
          uv run python ts/parity/generate_conversation_logger_golden.py
          uv run python ts/parity/generate_metadata_lifecycle_golden.py
          uv run python ts/parity/generate_prompt_assembly_golden.py
          uv run python ts/parity/generate_close_tail_golden.py
          uv run python ts/parity/generate_session_composite_golden.py
          uv run python ts/parity/generate_journey_repair_golden.py
          uv run python ts/parity/generate_backfill_golden.py
          uv run python ts/parity/generate_repair_encoding_golden.py
          uv run python ts/parity/generate_backup_golden.py
          uv run python ts/parity/generate_runtime_git_golden.py
          uv run python ts/parity/generate_release_notes_golden.py
          uv run python ts/parity/generate_runtime_status_golden.py
          uv run python ts/parity/generate_runtime_diagnose_golden.py
          uv run python ts/parity/generate_welcome_golden.py
          uv run python ts/parity/generate_soul_surface_golden.py
          uv run python ts/parity/generate_soul_state_golden.py
          uv run python ts/parity/generate_operating_mode_golden.py
          uv run python ts/parity/generate_soul_prompt_golden.py
          uv run python ts/parity/generate_soul_apply_golden.py
          uv run python ts/parity/generate_soul_harvest_golden.py
          uv run python ts/parity/generate_explorer_surface_golden.py
          uv run python ts/parity/generate_explorer_story_golden.py
          uv run python ts/parity/generate_explorer_handoff_golden.py
          uv run python ts/parity/generate_journey_update_golden.py
          uv run python ts/parity/generate_week_save_golden.py
          uv run python ts/parity/generate_journal_golden.py
          uv run python ts/parity/generate_week_plan_golden.py
          uv run python ts/parity/generate_descriptor_golden.py
          uv run python ts/parity/generate_lifecycle_faces_golden.py
          uv run python ts/parity/generate_cost_golden.py
          uv run python ts/parity/generate_builder_card_golden.py
          uv run python ts/parity/generate_builder_roadmap_golden.py
          uv run python ts/parity/generate_builder_method_golden.py
          uv run python ts/parity/generate_builder_orientation_golden.py
          uv run python ts/parity/generate_builder_command_golden.py
          uv run python ts/parity/generate_builder_cursor_golden.py
          uv run python ts/parity/generate_builder_resume_state_golden.py
          uv run python ts/parity/generate_builder_lifecycle_golden.py
          uv run python ts/parity/generate_builder_load_golden.py
          git diff --exit-code ts/test/goldens/
          # Two Builder generators also rewrite their committed fixture trees, so
          # drift there has to fail the gate too -- a golden that agrees with
          # silently changed fixtures proves nothing.
          git diff --exit-code ts/test/fixtures/builder-roadmap/
          git diff --exit-code ts/test/fixtures/builder-refinement/
          git diff --exit-code ts/test/fixtures/builder-command/
          # `git diff` cannot see a file that is not tracked yet, and the damage
          # this class produces is usually untracked: a generator that resolves a
          # write target to the repository writes NEW files into it (CR065's fifth
          # instance fabricated a roadmap package under a live code). Both times it
          # was caught by a human running `git status`. This is that check.
          if [ -n "$(git status --porcelain)" ]; then
            echo "A generator left the working tree dirty:"
            git status --porcelain
            echo "Generators must write only to their goldens, their fixtures, and tmp/."
            exit 1
          fi
        env:
          MEMORY_ENV: test
          ECONOMY_ENV: test

      # Fails when a ported Python oracle (DS4/DS5/DS6 surfaces) drifts from the
      # recorded baseline without a conscious advance. Green here means "no
      # oracle changed since baseline", NOT "TS is in parity" (see CR044/RS007).
      - name: Oracle-drift tripwire (ported Python oracles must match the baseline)
        run: uv run python scripts/check_oracle_drift.py

  ts:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macOS coverage guards the environment-dependent tmpdir/permission
        # behavior that a Linux-only matrix cannot catch.
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: ts

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      # The Python fallback e2e tests spawn `uv run python -m memory`; sync the
      # project (from the repo root) so those tests run for real instead of
      # skipping. uv resolves the root project from the ts/ working directory.
      - name: Install Python deps (for the fallback e2e)
        working-directory: ${{ github.workspace }}
        run: uv sync --extra dev --frozen

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Lint (Biome)
        run: npm run lint

      # CV22.DS8.US2 — since the close tail and search now reach a LIVE
      # provider when no replay fixture is configured, "CI cannot spend" must
      # be a checked property rather than a happy accident of the runner not
      # having a key. A leaked key in the environment would turn any test that
      # exercises those routes into real, silent spend.
      - name: Assert CI holds no provider key
        run: |
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            echo "OPENROUTER_API_KEY is set in CI; live provider routes could spend real money." >&2
            exit 1
          fi
          echo "no provider key present — live routes cannot be reached"

      - name: Run tests (node:test)
        run: npm test
        env:
          MEMORY_ENV: test

      # CR051 — this script was silently drifted from the CI-enforced
      # migrationFixtures.test.ts it duplicates; now wired into CI so that
      # can't happen unnoticed again.
      - name: Migration fixture structural parity (Navigator script)
        run: node parity/migration_structural_parity.ts

      # CR052 — same drift risk as CR051's sibling; includes a real 8-process
      # concurrency race, so expect more wall-clock time than the fixture check.
      - name: Bootstrap custody parity (Navigator script)
        run: node parity/bootstrap_custody_parity.ts

  parity:
    # Realism proof: behavioral parity against a real-shaped database, not only
    # synthetic-golden determinism. Needs both runtimes (Python oracle + TS core).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # The harness verifiers need no npm package, but the lifecycle smoke
      # spawns the real front door, which does (yaml, for the seed route).
      - name: Install TypeScript dependencies (for the front-door smoke)
        working-directory: ts
        run: npm ci

      - name: Generate portable demo database
        run: |
          mkdir -p tmp/parity
          uv run python ts/parity/generate_demo_memory_db.py --out tmp/parity/demo-memory.db
        env:
          MEMORY_ENV: test

      - name: Real-DB-copy parity (redacted, must pass)
        run: uv run python ts/parity/real_db_copy_parity.py --source-db tmp/parity/demo-memory.db
        env:
          MEMORY_ENV: test

      # Every write probe on the demo copy: the DS4/US5 deterministic writes,
      # the US10 extraction lifecycle (both cores answered by the same stub),
      # the TS1 mojibake repair over seeded rows, the US6 Soul ritual state
      # graded step by step, and the US7 Exploratory Story graded across BOTH
      # of its stores (the durable row and the legacy runtime payload) after
      # every step of one exploration. Builder cursor/artifact probes run here;
      # builder_load is intentionally excluded because it requires a private
      # 1536-wide corpus and refuses the portable 8-wide demo database.
      # Copy-only and redacted by design; no live database is ever involved.
      - name: Write parity on the demo copy (redacted, must pass)
        run: |
          for probe in reinforcement journey identity conversation_logger \
                       close_tail session_composites journey_repair_apply \
                       repair_encoding soul_state soul_apply soul_harvest_save \
                       explorer_story explorer_handoff builder_cursor_state \
                       builder_artifacts; do
            uv run python ts/parity/write_parity.py \
              --source-db tmp/parity/demo-memory.db --probe "$probe" \
              --work-dir "tmp/parity/write-$probe"
          done
        env:
          MEMORY_ENV: test

      # The hook-inclusive lifecycle smoke through the real front door: hooks
      # over stdin, the close tail under the replay transport, unflipped
      # subcommands through the real Python fallback (CV22.DS7.US10 slice F),
      # and the TS1 DB safety tools cross-checked against Python on the same
      # file (backup archives read by Python's zipfile; repair-encoding).
      - name: Conversation-logger lifecycle smoke (replay transport, must pass)
        run: node --no-warnings ts/parity/conversation_lifecycle_smoke.ts

      # The Ariad story lifecycle — adopt through done — run on BOTH engines over
      # two disposable worlds and compared after every step: streams, the Builder
      # runtime rows with `metadata` byte for byte, every authored artifact, and the
      # Journey projection the seam published. The TS side runs through the real
      # front-door process with NO gate in the environment, so since the
      # 2026-09-16 flip this smoke proves the shipped default. Linux is also a
      # third root length for the path-normalization invariant the artifact rows
      # depend on.
      - name: Builder Ariad lifecycle smoke (both engines, no gate, must pass)
        run: node --no-warnings ts/parity/builder_lifecycle_smoke.ts
