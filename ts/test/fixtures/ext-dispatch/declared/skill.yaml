id: declared
name: Declared Commands
category: extension
kind: command-skill
summary: Fixture extension whose subcommands declare a language-neutral runtime
table_prefix: ext_declared_

entrypoint:
  module: extension
  function: register

runtimes:
  pi:
    command_name: ext-declared
    skill_file: SKILL.md

# The contract half of CV22.DS7.TS4's D1. `runtime` hangs off the subcommand
# entries that already existed here, so an extension keeps ONE list of its
# subcommands instead of a declared list and a documented list that can drift.
#
# The Python twins are gone with CV22.DS10.TS2: there is no second engine to
# agree with, so these entries are graded directly. `legacy` and `broken` kept
# their names and lost their fallback -- both now refuse, which is the
# inversion the deletion causes.
cli:
  subcommands:
    - name: greet
      summary: Greet with the argv it received
      runtime:
        protocol: mirror-cli-v1
        command: [node, commands/greet.mjs]
    - name: fail
      summary: Exit 3 through the declared runtime
      runtime:
        protocol: mirror-cli-v1
        command: [node, commands/fail.mjs]
    - name: legacy
      summary: Declared with no runtime, so it refuses
    - name: broken
      summary: A malformed declaration is treated as undeclared, and refuses
      runtime:
        protocol: mirror-cli-v1
        command: []
